<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="email=no, telephone=no">
<title>Pharmacie du Chemin Vert – Adresse e-mail</title>
<style>
  :root { --green: #1E8A4C; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F4F7F5; color: #1A1A1A; text-align: center;
  }
  header { background: var(--green); color: #fff; padding: 18px 16px; font-size: 20px; font-weight: 700; }
  header .cross { display: inline-block; margin-right: 8px; }
  main { padding: 28px 18px; max-width: 480px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 18px; }
  .addr {
    background: #fff; border: 2px solid var(--green); border-radius: 12px;
    padding: 16px 10px; font-size: 17px; font-weight: 600; word-break: break-all;
    -webkit-user-select: all; user-select: all;
  }
  button {
    margin-top: 18px; width: 100%; padding: 20px; border: 0; border-radius: 14px;
    background: var(--green); color: #fff; font-size: 22px; font-weight: 700;
  }
  button.done { background: #0F5C31; }
  .steps { display: none; margin-top: 24px; text-align: left; background: #fff; border-radius: 12px; padding: 16px 18px; font-size: 18px; line-height: 1.6; }
  .steps.show { display: block; }
  .steps b { color: var(--green); }
</style>
</head>
<body>
<header><span class="cross">✚</span>Pharmacie du Chemin Vert</header>
<main>
  <h1>Envoyez-nous votre ordonnance</h1>
  <div class="addr" id="addr">pharmacieducheminvert51@gmail.com</div>
  <button id="btn">📋 Copier l'adresse</button>
  <div class="steps" id="steps">
    ✅ <b>Adresse copiée !</b><br>
    1. Retournez dans votre e-mail<br>
    2. Appuyez sur <b>Transférer</b><br>
    3. Appui long dans <b>« À : »</b> → <b>Coller</b><br>
    4. <b>Envoyer</b>
  </div>
</main>
<script>
  const EMAIL = 'pharmacieducheminvert51@gmail.com';
  const btn = document.getElementById('btn');

  function fallbackCopy() {
    const ta = document.createElement('textarea');
    ta.value = EMAIL;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, EMAIL.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }

  btn.addEventListener('click', async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(EMAIL); ok = true; }
    catch (e) { ok = fallbackCopy(); }
    if (ok) {
      btn.textContent = '✅ Adresse copiée';
      btn.classList.add('done');
      document.getElementById('steps').classList.add('show');
    } else {
      btn.textContent = 'Appui long sur l’adresse ci-dessus → Copier';
    }
  });
</script>
</body>
</html>
